name: Stock-lot MVP checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/stock-lot-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diagnose lockfile drift (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff -- package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
