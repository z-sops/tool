<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Application-specific identity marker. Used by the e2e preflight to
         confirm that a server really serves ListingAI and not another
         application that happens to occupy the same port. -->
    <meta name="application-name" content="ListingAI" />
    <meta name="listingai:app" content="listingai-web" />
    <title>NicheScout — E-commerce Product & Niche Research Platform</title>
    <meta name="description" content="Free product research, niche analysis, profit calculators, and AI listing generator for Amazon, Etsy & Shopify sellers." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="NicheScout — E-commerce Product & Niche Research Platform" />
    <meta property="og:description" content="Free product research, niche analysis, profit calculators, and AI listing generator for Amazon, Etsy & Shopify sellers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://listingai-woad.vercel.app" />
    <meta property="og:site_name" content="NicheScout" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NicheScout — E-commerce Product & Niche Research Platform" />
    <meta name="twitter:description" content="Free product research, niche analysis, profit calculators, and AI listing generator for Amazon, Etsy & Shopify sellers." />
    <link rel="canonical" href="https://listingai-woad.vercel.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; }
      html.light, html.light body { background-color: #ffffff !important; color: #000000; }
    </style>
    <script>
      (function () {
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add("light");
        document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
